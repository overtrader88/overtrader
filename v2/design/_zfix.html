<!doctype html><html><head><meta charset="utf-8"><style>
/* reproduz o stacking REAL do globals.css (com as regras relevantes) */
.analysis-page .configurator{position:relative;overflow:visible;z-index:20;padding:24px;border:1px solid #234;border-radius:18px;background:#0d1119;}
.analysis-page .cfg-glow{position:absolute;inset:0;z-index:0;border-radius:18px;background:radial-gradient(600px 200px at 6% -30%,rgba(84,168,255,.16),transparent 64%);}
.analysis-page .configurator > *:not(.cfg-glow){position:relative;z-index:1;}
.analysis-page .configurator .cfg-grid{z-index:30;}
.analysis-page .cfg-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:14px;}
.analysis-page .cfg-field{position:relative;}
.analysis-page .cfg-control{height:72px;border:1px solid #234;border-radius:15px;background:#0a0d14;color:#e9effa;width:100%;}
.analysis-page .cfg-dd{position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:60;border:1px solid #234;border-radius:16px;background:#0d1119;height:320px;color:#e9effa;}
.analysis-page .cfg-go{position:relative;overflow:hidden;margin-top:16px;width:100%;height:58px;border:none;border-radius:15px;background:linear-gradient(120deg,#54a8ff,#9a8bff);color:#04060c;font-weight:700;}
.analysis-page .cfg-trust{margin-top:18px;height:50px;border-top:1px solid #123;}
body{background:#07090e;margin:0;padding:30px;font-family:sans-serif;}
</style></head><body>
<div class="analysis-page"><div style="max-width:1100px;margin:0 auto;">
  <form class="configurator">
    <div class="cfg-glow"></div>
    <div class="cfg-grid">
      <div class="cfg-field">
        <button type="button" class="cfg-control">Ativo: SOLUSDT</button>
        <div class="cfg-dd" id="dd">dropdown (320px)</div>
      </div>
      <div class="cfg-field"><div class="cfg-control">Tipo</div></div>
      <div class="cfg-field"><div class="cfg-control">Timeframe</div></div>
    </div>
    <button type="button" class="cfg-go" id="go">Analisar agora</button>
    <div class="cfg-trust" id="trust">faixa de confiança</div>
  </form>
</div></div>
<script>
function probe(){
  const dd=document.getElementById('dd'), go=document.getElementById('go'), trust=document.getElementById('trust');
  const ddR=dd.getBoundingClientRect(), goR=go.getBoundingClientRect(), trR=trust.getBoundingClientRect();
  // ponto no centro do botão, dentro da faixa vertical onde o dropdown o cobre
  const probes=[];
  [[go,'go'],[trust,'trust']].forEach(([el,name])=>{
    const r=el.getBoundingClientRect();
    const y=r.top+r.height/2, x=r.left+r.width/2;
    if(ddR.bottom>y){ // dropdown cobre esse ponto verticalmente
      const top=document.elementFromPoint(x,y);
      probes.push({over:name,topElementId:top&&top.id,topIsDropdown:!!(top&&top.closest('#dd'))});
    } else probes.push({over:name,covered:false});
  });
  document.title=JSON.stringify({ddBottom:Math.round(ddR.bottom),goTop:Math.round(goR.top),trustTop:Math.round(trR.top),probes});
}
probe();
</script>
</body></html>
