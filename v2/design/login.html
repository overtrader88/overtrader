<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TradeAI — Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62.5..125,400..800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#07090E; --bg-2:#0A0D14; --panel:#0D1119; --panel-2:#0A0E15;
    --line:rgba(120,160,225,.08); --line-2:rgba(120,170,235,.17); --line-3:rgba(120,170,235,.32);
    --ink:#E9EFFA; --ink-soft:#93A0B6; --ink-faint:#535F74;
    --cyan:#54A8FF; --cyan-soft:rgba(84,168,255,.12); --glow:rgba(84,168,255,.5);
    --amber:#FFB020; --amber-soft:rgba(255,176,32,.12); --bull:#2BD49E; --bull-soft:rgba(43,212,158,.13);
    --r:6px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:"IBM Plex Sans",system-ui,sans-serif; background:var(--bg); color:var(--ink); line-height:1.55; min-height:100vh; display:grid; place-items:center; padding:32px;
    background-image:radial-gradient(900px 560px at 28% 12%, rgba(84,168,255,.12), transparent 60%), radial-gradient(760px 560px at 80% 90%, rgba(43,212,158,.06), transparent 60%); background-attachment:fixed; }
  ::selection{ background:var(--cyan); color:#04060c; } a{ color:inherit; text-decoration:none; }
  .mono{ font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums; }
  .xp{ font-family:"Archivo"; font-variation-settings:'wdth' 125; }

  .auth{ width:100%; max-width:940px; display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--line-2); border-radius:14px; overflow:hidden; box-shadow:0 40px 100px -50px #000; }
  @media(max-width:760px){ .auth{ grid-template-columns:1fr; max-width:440px; } .auth .left{ display:none; } }

  /* esquerda: prova */
  .left{ padding:42px 40px; background:linear-gradient(160deg, #0E1420, var(--panel-2)); position:relative; display:flex; flex-direction:column; }
  .left::after{ content:""; position:absolute; inset:0; pointer-events:none; box-shadow:inset -1px 0 0 var(--line-2); }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:auto; }
  .brand svg{ filter:drop-shadow(0 0 7px var(--glow)); } .brand .name{ font-family:"Archivo"; font-variation-settings:'wdth' 125; font-weight:700; font-size:18px; letter-spacing:.04em; text-transform:uppercase; } .brand .name b{ color:var(--cyan); }
  .left h2{ font-family:"Archivo"; font-variation-settings:'wdth' 125; font-weight:800; font-size:34px; line-height:1.04; margin:40px 0 14px; }
  .left p{ font-size:14px; color:var(--ink-soft); max-width:34ch; }
  .proof{ margin-top:28px; border:1px solid var(--line-2); border-radius:10px; padding:15px; background:var(--bg-2); }
  .proof .bar{ display:flex; align-items:center; gap:9px; font-family:"JetBrains Mono"; font-size:10px; color:var(--ink-soft); margin-bottom:12px; }
  .proof .bar .seal{ margin-left:auto; display:inline-flex; align-items:center; gap:7px; color:var(--amber); font-size:9.5px; }
  .proof .bar .seal .led{ width:8px; height:8px; border-radius:50%; background:var(--amber); box-shadow:0 0 9px var(--amber); }
  .cib{ --min:0;--max:3.5;--lo:1.42;--hi:2.51;--v:1.89; }
  .cib .t{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:9px; }
  .cib .nm{ font-family:"JetBrains Mono"; font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-soft); } .cib .pt{ font-family:"JetBrains Mono"; font-weight:700; font-size:17px; color:var(--bull); }
  .cib .sc{ position:relative; height:20px; } .cib .ax{ position:absolute; left:0;right:0;top:50%;height:1px;background:var(--line-2); }
  .cib .bd{ position:absolute; top:50%; transform:translateY(-50%); height:7px; border-radius:2px; background:var(--bull-soft); border:1px solid var(--bull); box-shadow:0 0 12px var(--bull-soft);
    left:calc((var(--lo)-var(--min))/(var(--max)-var(--min))*100%); width:calc((var(--hi)-var(--lo))/(var(--max)-var(--min))*100%); }
  .cib .bd::before,.cib .bd::after{ content:"";position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--bull);} .cib .bd::before{left:-1px}.cib .bd::after{right:-1px}
  .cib .rt{ position:absolute; top:50%; width:12px;height:12px;transform:translate(-50%,-50%); left:calc((var(--v)-var(--min))/(var(--max)-var(--min))*100%); }
  .cib .rt::before,.cib .rt::after{content:"";position:absolute;background:var(--ink);} .cib .rt::before{left:50%;top:0;bottom:0;width:1.5px;transform:translateX(-50%)} .cib .rt::after{top:50%;left:0;right:0;height:1.5px;transform:translateY(-50%)}
  .cib .ft{ display:flex; justify-content:space-between; font-family:"JetBrains Mono"; font-size:9.5px; color:var(--ink-faint); margin-top:8px; } .cib .ft b{ color:var(--ink-soft); }

  /* direita: form */
  .right{ padding:42px 40px; background:linear-gradient(180deg,var(--panel),var(--panel-2)); }
  .right .kick{ font-family:"JetBrains Mono"; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-faint); }
  .right h1{ font-family:"Archivo"; font-variation-settings:'wdth' 125; font-weight:800; font-size:28px; margin:8px 0 26px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-family:"JetBrains Mono"; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:7px; }
  .field input{ width:100%; background:var(--bg-2); border:1px solid var(--line-2); border-radius:8px; padding:13px 14px; color:var(--ink); font-family:"IBM Plex Sans"; font-size:14px; transition:.16s; }
  .field input::placeholder{ color:var(--ink-faint); }
  .field input:focus{ outline:none; border-color:var(--cyan); box-shadow:0 0 0 3px var(--cyan-soft); }
  .frow{ display:flex; justify-content:space-between; align-items:center; margin:-4px 0 22px; }
  .frow .rmb{ font-size:12.5px; color:var(--ink-soft); display:flex; align-items:center; gap:8px; } .frow .rmb input{ accent-color:var(--cyan); }
  .frow a{ font-size:12.5px; color:var(--cyan); }
  .btn{ width:100%; text-align:center; font-family:"JetBrains Mono"; font-size:13.5px; font-weight:700; padding:14px; border-radius:8px; border:1px solid var(--cyan); background:var(--cyan); color:#04060c; cursor:pointer; transition:.18s; }
  .btn:hover{ box-shadow:0 8px 26px -8px var(--glow); }
  .divider{ display:flex; align-items:center; gap:14px; margin:22px 0; font-family:"JetBrains Mono"; font-size:10.5px; color:var(--ink-faint); } .divider::before,.divider::after{ content:""; flex:1; height:1px; background:var(--line-2); }
  .btn.alt{ background:transparent; color:var(--ink); border-color:var(--line-2); font-weight:500; display:flex; align-items:center; justify-content:center; gap:10px; }
  .btn.alt:hover{ border-color:var(--line-3); box-shadow:none; }
  .foot{ text-align:center; font-size:13px; color:var(--ink-soft); margin-top:24px; } .foot a{ color:var(--cyan); font-weight:500; }
</style>
</head>
<body>
  <div class="auth">
    <!-- ESQUERDA -->
    <div class="left">
      <div class="brand">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><rect x="2" y="2" width="24" height="24" rx="6" stroke="#54A8FF" stroke-width="1.5"/><path d="M6 19 L11 12 L15 16 L22 7" stroke="#54A8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="22" cy="7" r="2" fill="#2BD49E"/></svg>
        <span class="name">Trade<b>AI</b></span>
      </div>
      <h2>Bom te ver<br>de novo.</h2>
      <p>O motor continua medindo: amostra, intervalo de confiança e período em cada número.</p>
      <div class="proof">
        <div class="bar">BTCUSDT · 4H<span class="seal"><span class="led"></span>VALIDADO</span></div>
        <div class="cib">
          <div class="t"><span class="nm">Profit factor · backtest</span><span class="pt">1.89</span></div>
          <div class="sc"><div class="ax"></div><div class="bd"></div><div class="rt"></div></div>
          <div class="ft"><span>IC 95% <b>1.42 — 2.51</b></span><span>n=142</span></div>
        </div>
      </div>
    </div>

    <!-- DIREITA -->
    <div class="right">
      <div class="kick">Acesso à conta</div>
      <h1>Entrar</h1>
      <div class="field"><label>E-mail</label><input type="email" placeholder="voce@email.com" /></div>
      <div class="field"><label>Senha</label><input type="password" placeholder="••••••••••" /></div>
      <div class="frow">
        <label class="rmb"><input type="checkbox" checked /> Manter conectado</label>
        <a href="#">Esqueci a senha</a>
      </div>
      <button class="btn">Entrar</button>
      <div class="divider">ou continue com</div>
      <button class="btn alt">
        <svg width="16" height="16" viewBox="0 0 18 18"><path fill="#fff" d="M17.6 9.2c0-.6-.05-1.2-.16-1.7H9v3.3h4.8a4.1 4.1 0 0 1-1.8 2.7v2.2h2.9c1.7-1.6 2.7-3.9 2.7-6.5z"/><path fill="#fff" d="M9 18c2.4 0 4.5-.8 6-2.2l-2.9-2.2c-.8.5-1.8.9-3.1.9-2.4 0-4.4-1.6-5.1-3.8H.9v2.3A9 9 0 0 0 9 18z" opacity=".7"/><path fill="#fff" d="M3.9 10.7a5.4 5.4 0 0 1 0-3.4V5H.9a9 9 0 0 0 0 8z" opacity=".5"/><path fill="#fff" d="M9 3.6c1.3 0 2.5.5 3.4 1.3l2.6-2.6A9 9 0 0 0 .9 5l3 2.3C4.6 5.2 6.6 3.6 9 3.6z" opacity=".85"/></svg>
        Google
      </button>
      <div class="foot">Não tem conta? <a href="#">Criar conta grátis →</a></div>
    </div>
  </div>
</body>
</html>
