<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#0d1119;color:#e9effa;font-family:"JetBrains Mono",monospace;padding:24px;}
h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#93a0b6;margin:0 0 14px;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:560px;}
.item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:11px;background:#0a0d14;border:1px solid rgba(120,170,235,.17);}
.av{width:32px;height:32px;border-radius:10px;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.1),rgba(255,255,255,.03));box-shadow:inset 0 0 0 1px rgba(120,170,235,.17);padding:5px;overflow:hidden;display:grid;place-items:center;}
.av img{width:100%;height:100%;object-fit:contain;}
.sym{font-size:13px;font-weight:600;}.name{font-size:11px;color:#93a0b6;}
</style></head><body>
<h3>Cripto que faltavam — agora via cryptofonts (fallback)</h3>
<div class="grid" id="g"></div>
<script>
const M=[['near','NEAR','NEAR'],['apt','APT','Aptos'],['arb','ARB','Arbitrum'],['op','OP','Optimism'],['inj','INJ','Injective'],['sui','SUI','Sui'],['shib','SHIB','Shiba Inu'],['ldo','LDO','Lido DAO'],['gala','GALA','Gala'],['axs','AXS','Axie Infinity'],['rune','RUNE','THORChain'],['iota','IOTA','IOTA']];
document.getElementById('g').innerHTML=M.map(([b,s,n])=>`<div class="item"><span class="av"><img src="https://cryptofonts.com/img/icons/${b}.svg"></span><span><div class="sym">${s}USDT</div><div class="name">${n}</div></span></div>`).join('');
</script>
</body></html>
